<!doctype html><html><head><meta charset="utf-8"><title>opaque.html</title></head><body><h1>Contact</h1>
<form id=f><input name="name" required><input type="email" name="email" required><textarea name="message" required></textarea><button type="submit">Send message</button></form><script>f.onsubmit=e=>{e.preventDefault();fetch('/api/contact',{method:'POST',body:btoa(unescape(encodeURIComponent(JSON.stringify(Object.fromEntries(new FormData(f))))))}).catch(()=>{})}</script>
</body></html>
