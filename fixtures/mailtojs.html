<!doctype html><html><head><meta charset="utf-8"><title>mailtojs.html</title></head><body><h1>Contact</h1>
<form id=f><input name="name" required><input type="email" name="email" required><textarea name="message" required></textarea><button type="submit">Send message</button></form><script>f.onsubmit=e=>{e.preventDefault();window.location.href='mailto:owner@example.com?subject=Hi&body='+encodeURIComponent(new FormData(f).get('message'))}</script>
</body></html>
