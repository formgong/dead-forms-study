<!doctype html><html><head><meta charset="utf-8"><title>website field</title></head><body><h1>Contact</h1>
<form id=f><input name="name" required><input type="email" name="email" required><input type="url" name="website" placeholder="Your website" required><textarea name="message" required></textarea><button type="submit">Send message</button></form><div id=t></div>
<script>f.onsubmit=async e=>{e.preventDefault();try{await fetch('https://api.example-forms.test/submit',{method:'POST',body:new FormData(f)})}catch{};t.textContent='Thanks!'}</script>
</body></html>
